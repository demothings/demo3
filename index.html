<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14231D" />
  <title>Sample Hostel Desk — Demo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(160deg, #14231D 0%, #1A2E27 55%, #1F3B33 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #splash .splash-icon {
      font-size: 46px;
      line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }
    #splash .splash-title {
      color: #FAF7F1;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.2px;
      font-family: "Fraunces", Georgia, serif;
    }
    #splash .splash-sub {
      color: #E08A4F;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    #splash .splash-bar {
      margin-top: 6px;
      width: 120px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255,255,255,0.14);
      overflow: hidden;
    }
    #splash .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: #C2410C;
      animation: splashSlide 1.1s ease-in-out infinite;
    }
    @keyframes splashSlide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="splash">
    <div class="splash-icon">🏨</div>
    <div class="splash-title">Sample Hostel</div>
    <div class="splash-sub">Demo</div>
    <div class="splash-bar"></div>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    fetch("app.jsx")
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load app.jsx (" + res.status + ")");
        return res.text();
      })
      .then(function (source) {
        var compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
        console.log("COMPILED LENGTH:", compiled.length);
        console.log("COMPILED FIRST 400 CHARS:", JSON.stringify(compiled.slice(0, 400)));
        var script = document.createElement("script");
        script.textContent = compiled + "\n;window.__App = App;";
        document.body.appendChild(script);
        var root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.__App));
      })
      .catch(function (err) {
        document.getElementById("root").textContent = "Failed to load: " + err.message;
        console.error(err);
      });
  </script>

  <script>
    (function () {
      const splash = document.getElementById("splash");
      const rootEl = document.getElementById("root");
      function hideSplash() {
        if (!splash) return;
        splash.classList.add("splash-hidden");
        setTimeout(() => splash.remove(), 400);
      }
      const observer = new MutationObserver(() => {
        if (rootEl.childNodes.length > 0) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(rootEl, { childList: true, subtree: true });
      setTimeout(hideSplash, 6000);
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
